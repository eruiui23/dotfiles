theme = "eruiui23"
client_id = "5e3421000aac4518b831f97a416964f1"
client_port = 8080
login_redirect_uri = "http://127.0.0.1:8989/login"
playback_format = """
{status} {track} • {artists} {liked}
{album}
{metadata}"""
playback_metadata_fields = [
    "repeat",
    "shuffle",
    "volume",
    "device",
]
notify_timeout_in_secs = 0
tracks_playback_limit = 50
app_refresh_duration_in_ms = 32
playback_refresh_duration_in_ms = 0
page_size_in_rows = 20
play_icon = " "
pause_icon = " "
liked_icon = "󰋑"
border_type = "Rounded"
progress_bar_type = "Rectangle"
progress_bar_position = "Right"
# cover_img_length = 9
cover_img_width = 5 
cover_img_scale = 1.0
enable_media_control = true
enable_streaming = "Always"
enable_notify = true
enable_cover_image_cache = true
default_device = "speaker"
notify_streaming_only = false
seek_duration_secs = 5
sort_artist_albums_by_type = false
enable_audio_visualization = false
enable_relative_line_number = true
notify_transient = true
[notify_format]
summary = "{track} • {artists}"
body = "{album}"

[layout]
playback_window_position = "Bottom"
playback_window_height = 6

[layout.library]
playlist_percent = 33
album_percent = 33

[device]
name = "yumiji-player"
device_type = "speaker"
volume = 70
bitrate = 320
audio_cache = false
normalization = false
autoplay = false


